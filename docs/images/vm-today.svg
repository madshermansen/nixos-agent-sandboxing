<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <title>What runs today: the Mac, the agent VM inside it, the broker, and the internet</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- The Mac -->
  <rect x="20" y="20" width="790" height="520" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="40" y="50" font-size="17" font-weight="600" fill="#0f172a">Your Mac</text>
  <text x="290" y="50" fill="#475569" font-size="13">Two localhost ports lead into the VM. One proxy leads out. No folders are shared.</text>

  <!-- Mac-side parts -->
  <rect x="40" y="90" width="190" height="78" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="56" y="116" font-weight="600" fill="#0f172a">T3 Code app</text>
  <text x="56" y="137" fill="#475569" font-size="13">starts threads in the VM</text>
  <text x="56" y="155" fill="#475569" font-size="13">through localhost:3774</text>

  <rect x="40" y="196" width="190" height="78" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="56" y="222" font-weight="600" fill="#0f172a">Terminal</text>
  <text x="56" y="243" fill="#475569" font-size="13">nix run .#ssh</text>
  <text x="56" y="261" fill="#475569" font-size="13">through localhost:2222</text>

  <rect x="40" y="302" width="190" height="90" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="56" y="328" font-weight="600" fill="#0f172a">State folder</text>
  <text x="56" y="349" fill="#475569" font-size="13">~/.local/state/agent-vm</text>
  <text x="56" y="367" fill="#475569" font-size="13">VM disk, SSH key,</text>
  <text x="56" y="383" fill="#475569" font-size="13">broker log</text>

  <rect x="40" y="424" width="190" height="82" rx="8" fill="#ffffff" stroke="#64748b" stroke-dasharray="5 4"/>
  <text x="56" y="450" font-weight="600" fill="#0f172a">Linux builder</text>
  <text x="56" y="471" fill="#475569" font-size="13">builds the VM,</text>
  <text x="56" y="489" fill="#475569" font-size="13">idle while it runs</text>

  <!-- The VM -->
  <rect x="290" y="70" width="280" height="446" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="308" y="98" font-size="16" font-weight="600" fill="#1e3a8a">Agent VM</text>
  <text x="308" y="118" fill="#1e40af" font-size="13">headless NixOS in QEMU, user "agent"</text>

  <rect x="308" y="136" width="244" height="56" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="324" y="160" font-weight="600" fill="#0f172a">T3 server</text>
  <text x="324" y="180" fill="#475569" font-size="13">receives threads from the app</text>

  <rect x="308" y="222" width="244" height="56" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="324" y="246" font-weight="600" fill="#0f172a">Claude Code</text>
  <text x="324" y="266" fill="#475569" font-size="13">started by T3 for each thread</text>

  <rect x="308" y="308" width="244" height="56" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="324" y="332" font-weight="600" fill="#0f172a">SSH server</text>
  <text x="324" y="352" fill="#475569" font-size="13">key only</text>

  <rect x="308" y="394" width="244" height="100" rx="8" fill="#ffffff" stroke="#2563eb" stroke-dasharray="5 4"/>
  <text x="324" y="418" font-weight="600" fill="#0f172a">Locked network</text>
  <text x="324" y="440" fill="#475569" font-size="13">no internet, no Mac,</text>
  <text x="324" y="460" fill="#475569" font-size="13">no name lookups;</text>
  <text x="324" y="480" fill="#475569" font-size="13">enforced by QEMU, outside the VM</text>

  <!-- Mac to VM -->
  <line x1="230" y1="129" x2="306" y2="162" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="235" x2="306" y2="334" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="192" x2="430" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- The broker -->
  <rect x="630" y="150" width="160" height="230" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="646" y="178" font-size="16" font-weight="600" fill="#14532d">Broker</text>
  <text x="646" y="199" fill="#166534" font-size="13">a proxy, the VM's</text>
  <text x="646" y="216" fill="#166534" font-size="13">only way out</text>

  <rect x="644" y="234" width="132" height="62" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text x="658" y="258" font-weight="600" fill="#0f172a">rules.yaml</text>
  <text x="658" y="278" fill="#475569" font-size="13">what may pass</text>

  <rect x="644" y="306" width="132" height="62" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text x="658" y="330" font-weight="600" fill="#0f172a">Log</text>
  <text x="658" y="350" fill="#475569" font-size="13">every decision</text>

  <line x1="570" y1="250" x2="628" y2="250" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Destinations -->
  <rect x="850" y="110" width="130" height="72" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="915" y="140" text-anchor="middle" font-weight="600" fill="#0f172a">GitHub</text>
  <text x="915" y="161" text-anchor="middle" fill="#166534" font-size="13">passed through</text>

  <rect x="850" y="229" width="130" height="72" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="915" y="259" text-anchor="middle" font-weight="600" fill="#0f172a">Anthropic</text>
  <text x="915" y="280" text-anchor="middle" fill="#166534" font-size="13">passed through</text>

  <rect x="850" y="348" width="130" height="72" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="915" y="378" text-anchor="middle" font-weight="600" fill="#0f172a">Everything else</text>
  <text x="915" y="399" text-anchor="middle" fill="#b91c1c" font-size="13">refused</text>

  <line x1="790" y1="210" x2="848" y2="150" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="790" y1="265" x2="848" y2="265" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="790" y1="320" x2="848" y2="380" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
</svg>
