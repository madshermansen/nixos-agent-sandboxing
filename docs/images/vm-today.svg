<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <title>What runs today: the Mac, the agent VM inside it, and the internet</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- The Mac -->
  <rect x="20" y="20" width="740" height="520" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="40" y="50" font-size="17" font-weight="600" fill="#0f172a">Your Mac</text>

  <!-- Mac-side parts -->
  <rect x="40" y="90" width="220" height="64" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="56" y="117" font-weight="600" fill="#0f172a">T3 Code app</text>
  <text x="56" y="138" fill="#475569" font-size="13">where you start threads</text>

  <rect x="40" y="200" width="220" height="64" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="56" y="227" font-weight="600" fill="#0f172a">Terminal</text>
  <text x="56" y="248" fill="#475569" font-size="13">nix run .#ssh</text>

  <rect x="40" y="310" width="220" height="86" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="56" y="337" font-weight="600" fill="#0f172a">State folder</text>
  <text x="56" y="358" fill="#475569" font-size="13">~/.local/state/agent-vm</text>
  <text x="56" y="378" fill="#475569" font-size="13">VM disk and SSH key</text>

  <rect x="40" y="440" width="220" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-dasharray="5 4"/>
  <text x="56" y="467" font-weight="600" fill="#0f172a">Linux builder</text>
  <text x="56" y="488" fill="#475569" font-size="13">builds the VM from this repo,</text>
  <text x="56" y="505" fill="#475569" font-size="13">not used while it runs</text>

  <!-- The VM -->
  <rect x="420" y="70" width="320" height="446" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="438" y="98" font-size="16" font-weight="600" fill="#1e3a8a">Agent VM</text>
  <text x="438" y="118" fill="#1e40af" font-size="13">headless NixOS in QEMU, user "agent"</text>

  <rect x="440" y="136" width="280" height="56" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="456" y="160" font-weight="600" fill="#0f172a">T3 server</text>
  <text x="456" y="180" fill="#475569" font-size="13">port 3773</text>

  <rect x="440" y="222" width="280" height="56" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="456" y="246" font-weight="600" fill="#0f172a">Claude Code</text>
  <text x="456" y="266" fill="#475569" font-size="13">started by the T3 server for each thread</text>

  <rect x="440" y="308" width="280" height="56" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="456" y="332" font-weight="600" fill="#0f172a">SSH server</text>
  <text x="456" y="352" fill="#475569" font-size="13">port 22, key only</text>

  <rect x="440" y="394" width="280" height="100" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="456" y="418" font-weight="600" fill="#0f172a">On the VM's own disk</text>
  <text x="456" y="440" fill="#475569" font-size="13">/home/agent: repos, Claude sign-in</text>
  <text x="456" y="460" fill="#475569" font-size="13">tools: git, gh, node, ripgrep, jq</text>
  <text x="456" y="480" fill="#475569" font-size="13">its own copy of the Nix store</text>

  <!-- Mac to VM -->
  <line x1="260" y1="122" x2="438" y2="162" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="282" y="118" width="124" height="22" rx="4" fill="#f8fafc"/>
  <text x="344" y="134" text-anchor="middle" fill="#0f172a" font-size="13">localhost:3774</text>

  <line x1="260" y1="232" x2="438" y2="334" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="282" y="268" width="124" height="22" rx="4" fill="#f8fafc"/>
  <text x="344" y="284" text-anchor="middle" fill="#0f172a" font-size="13">localhost:2222</text>

  <line x1="260" y1="353" x2="438" y2="440" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="296" y="398" width="96" height="22" rx="4" fill="#f8fafc"/>
  <text x="344" y="414" text-anchor="middle" fill="#0f172a" font-size="13">disk image</text>

  <!-- Inside the VM -->
  <line x1="580" y1="192" x2="580" y2="220" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Internet -->
  <rect x="820" y="150" width="160" height="200" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="900" y="180" text-anchor="middle" font-size="16" font-weight="600" fill="#78350f">Internet</text>
  <text x="900" y="212" text-anchor="middle" fill="#78350f" font-size="13">Anthropic</text>
  <text x="900" y="234" text-anchor="middle" fill="#78350f" font-size="13">GitHub</text>
  <text x="900" y="256" text-anchor="middle" fill="#78350f" font-size="13">everything else</text>
  <text x="900" y="300" text-anchor="middle" fill="#92400e" font-size="12">open for now,</text>
  <text x="900" y="318" text-anchor="middle" fill="#92400e" font-size="12">locked in phase 3</text>

  <line x1="740" y1="250" x2="818" y2="250" stroke="#b45309" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Key -->
  <text x="290" y="60" fill="#475569" font-size="13">Only two localhost ports lead into the VM. No folders are shared with it.</text>
</svg>
