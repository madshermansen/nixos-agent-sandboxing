<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <title>The target design: the VM reaches the internet only through a broker on the Mac that adds the keys</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#ffffff"/>

  <!-- The Mac -->
  <rect x="20" y="20" width="740" height="520" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="40" y="50" font-size="17" font-weight="600" fill="#0f172a">Your Mac</text>
  <text x="290" y="50" fill="#475569" font-size="13">Built for GitHub: the key swap, and limits on repos and actions.</text>

  <!-- The VM -->
  <rect x="40" y="80" width="280" height="330" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="58" y="108" font-size="16" font-weight="600" fill="#1e3a8a">Agent VM</text>
  <text x="58" y="128" fill="#1e40af" font-size="13">holds no real keys</text>

  <rect x="60" y="146" width="240" height="56" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="76" y="170" font-weight="600" fill="#0f172a">T3 server and Claude Code</text>
  <text x="76" y="190" fill="#475569" font-size="13">the agent works here</text>

  <rect x="60" y="222" width="240" height="76" rx="8" fill="#ffffff" stroke="#2563eb"/>
  <text x="76" y="246" font-weight="600" fill="#0f172a">git and gh</text>
  <text x="76" y="266" fill="#475569" font-size="13">send a placeholder in place</text>
  <text x="76" y="284" fill="#475569" font-size="13">of the GitHub token</text>

  <rect x="60" y="318" width="240" height="72" rx="8" fill="#ffffff" stroke="#2563eb" stroke-dasharray="5 4"/>
  <text x="76" y="342" font-weight="600" fill="#0f172a">Locked network</text>
  <text x="76" y="362" fill="#475569" font-size="13">the only way out is the</text>
  <text x="76" y="380" fill="#475569" font-size="13">broker's port on the Mac</text>

  <!-- T3 app -->
  <rect x="40" y="450" width="280" height="64" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="56" y="477" font-weight="600" fill="#0f172a">T3 Code app</text>
  <text x="56" y="498" fill="#475569" font-size="13">linked to the VM over localhost</text>
  <line x1="180" y1="448" x2="180" y2="412" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Broker -->
  <rect x="440" y="80" width="300" height="330" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="458" y="108" font-size="16" font-weight="600" fill="#14532d">Broker</text>
  <text x="458" y="128" fill="#166534" font-size="13">a proxy that reads what is sent to GitHub</text>

  <rect x="460" y="146" width="260" height="76" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text x="476" y="170" font-weight="600" fill="#0f172a">rules.yaml</text>
  <text x="476" y="190" fill="#475569" font-size="13">allowed destinations and repos,</text>
  <text x="476" y="208" fill="#475569" font-size="13">refused actions, refusal messages</text>

  <rect x="460" y="242" width="260" height="60" rx="8" fill="#ffffff" stroke="#15803d"/>
  <text x="476" y="266" font-weight="600" fill="#0f172a">Key swap</text>
  <text x="476" y="286" fill="#475569" font-size="13">placeholder out, real token in</text>

  <rect x="460" y="322" width="260" height="68" rx="8" fill="#ffffff" stroke="#64748b"/>
  <text x="476" y="346" font-weight="600" fill="#0f172a">1Password</text>
  <text x="476" y="366" fill="#475569" font-size="13">real GitHub token, read at start</text>
  <line x1="590" y1="320" x2="590" y2="304" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- VM to broker -->
  <line x1="320" y1="250" x2="438" y2="250" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="336" y="218" width="88" height="22" rx="4" fill="#f8fafc"/>
  <text x="380" y="234" text-anchor="middle" fill="#0f172a" font-size="13">all traffic</text>

  <!-- Destinations -->
  <rect x="820" y="80" width="160" height="80" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="900" y="112" text-anchor="middle" font-weight="600" fill="#0f172a">GitHub</text>
  <text x="900" y="134" text-anchor="middle" fill="#166534" font-size="13">token added</text>

  <rect x="820" y="205" width="160" height="80" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="900" y="237" text-anchor="middle" font-weight="600" fill="#0f172a">Anthropic</text>
  <text x="900" y="259" text-anchor="middle" fill="#166534" font-size="13">passed through</text>

  <rect x="820" y="330" width="160" height="80" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="900" y="362" text-anchor="middle" font-weight="600" fill="#0f172a">Everything else</text>
  <text x="900" y="384" text-anchor="middle" fill="#b91c1c" font-size="13">refused</text>

  <line x1="740" y1="170" x2="818" y2="126" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="740" y1="245" x2="818" y2="245" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="740" y1="330" x2="818" y2="366" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>

  <!-- Foot note -->
  <text x="440" y="467" fill="#475569" font-size="13">The agent can be tricked or mistaken.</text>
  <text x="440" y="487" fill="#475569" font-size="13">So nothing it can read is worth stealing,</text>
  <text x="440" y="507" fill="#475569" font-size="13">and the rules sit outside its reach.</text>
</svg>
